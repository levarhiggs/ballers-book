<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Baller's Book</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baller's Book">
<meta name="theme-color" content="#F4F6F8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1419" media="(prefers-color-scheme: dark)">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon-32.png">
<link rel="stylesheet" href="shared/shell.css">
<style>
:root{--page:#F4F6F8;--surface-1:#FFFFFF;--text-primary:#14202B;--text-secondary:#5B6772;--border:#D8DEE4;--border-strong:#B3BCC5;--bg-accent:#E6F1FB;--border-accent:#185FA5;--text-accent:#0C447C;
  --tag-inbound:#0F6E56;--tag-offense:#534AB7;--tag-defense:#A3282F;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#0F1419;--surface-1:#1A222B;--text-primary:#E8EDF2;--text-secondary:#9AA7B3;--border:#2A343E;--border-strong:#46535F;--bg-accent:#12304D;--border-accent:#5C9BDB;--text-accent:#B5D4F4;
  --tag-inbound:#4FC9A4;--tag-offense:#A49CF0;--tag-defense:#F08A8F;}}
:root[data-theme="dark"]{--page:#0F1419;--surface-1:#1A222B;--text-primary:#E8EDF2;--text-secondary:#9AA7B3;--border:#2A343E;--border-strong:#46535F;--bg-accent:#12304D;--border-accent:#5C9BDB;--text-accent:#B5D4F4;
  --tag-inbound:#4FC9A4;--tag-offense:#A49CF0;--tag-defense:#F08A8F;}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--text-primary);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-text-size-adjust:100%}
.wrap{max-width:1100px;margin:0 auto;padding:20px max(16px,env(safe-area-inset-right,0px)) 40px max(16px,env(safe-area-inset-left,0px))}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;margin:4px 0 20px}
h1{font-size:30px;font-weight:700;margin:0;letter-spacing:.2px;flex:1;min-width:200px}
.meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ver{font-size:14px;color:var(--text-secondary);font-variant-numeric:tabular-nums}
.pill{font-size:14px;font-weight:500;padding:6px 12px;border-radius:999px;border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);display:inline-flex;align-items:center;gap:7px;min-height:36px}
.pill::before{content:"";width:9px;height:9px;border-radius:50%;background:currentColor;opacity:.8}
.pill.ok{color:var(--tag-inbound);border-color:currentColor}
.pill.warn{color:var(--tag-defense);border-color:currentColor}
.bb-btn.update{border-color:var(--border-accent);background:var(--bg-accent);color:var(--text-accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{display:flex;gap:16px;align-items:center;padding:16px;min-height:132px;background:var(--surface-1);border:1px solid var(--border);border-radius:16px;color:inherit;text-decoration:none;position:relative}
.card:active{transform:scale(.99)}
.card:focus-visible{outline:3px solid var(--border-accent);outline-offset:2px}
.thumb{width:104px;height:104px;flex-shrink:0;border-radius:10px;background:var(--page);border:1px solid var(--border)}
.thumb .ln{fill:none;stroke:var(--border-strong);stroke-width:1.4}
.info{min-width:0}
.name{font-size:21px;font-weight:600;margin:0 0 4px}
.desc{font-size:15px;color:var(--text-secondary);margin:0 0 10px}
.tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px;border:1px solid currentColor}
.tag.Inbound{color:var(--tag-inbound)}.tag.Offense{color:var(--tag-offense)}.tag.Defense{color:var(--tag-defense)}
.last{position:absolute;top:10px;right:12px;font-size:12px;color:var(--text-secondary)}
.empty{color:var(--text-secondary)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Baller's Book</h1>
    <div class="meta">
      <span class="pill" id="status" role="status">Checking offline…</span>
      <button type="button" class="bb-btn update" id="update" hidden>Update</button>
      <span class="ver" id="ver"></span>
    </div>
  </header>
  <main class="grid" id="plays" aria-label="Plays"></main>
</div>
<script src="shared/version.js"></script>
<script>
(function(){
const NS='http://www.w3.org/2000/svg';
const COLORS=['#534AB7','#0F6E56','#993C1D','#993556','#185FA5'];
const last=(()=>{try{return JSON.parse(localStorage.getItem('ballersBook.lastPlay'));}catch(e){return null;}})();
document.getElementById('ver').textContent='v'+self.BB_VERSION;

// mini half court in a 0-100 box (baseline at y=0); dots are mapped from each play's own frame
function thumb(t){
  const s=document.createElementNS(NS,'svg');
  s.setAttribute('viewBox','-6 -12 112 114');s.setAttribute('class','thumb');s.setAttribute('aria-hidden','true');
  s.innerHTML='<rect class="ln" x="0" y="0" width="100" height="100"/><rect class="ln" x="33.8" y="0" width="32.4" height="40.3"/>'+
    '<path class="ln" d="M5.9 0 L5.9 29.5 A47.4 47.4 0 0 0 94.1 29.5 L94.1 0"/><circle class="ln" cx="50" cy="11.3" r="2"/>';
  if(!t) return s;
  const [x0,y0,x1,y1]=t.frame,mx=x=>(x-x0)/(x1-x0)*100,my=y=>(y-y0)/(y1-y0)*100;
  (t.dots||[]).forEach((d,i)=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',mx(d[0]));c.setAttribute('cy',my(d[1]));c.setAttribute('r',5.2);c.setAttribute('fill',COLORS[i%5]);s.appendChild(c);});
  if(t.ball){const b=document.createElementNS(NS,'circle');b.setAttribute('cx',mx(t.ball[0])+4.5);b.setAttribute('cy',my(t.ball[1])+4);b.setAttribute('r',2.6);b.setAttribute('fill','#EF9F27');b.setAttribute('stroke','#854F0B');b.setAttribute('stroke-width','.6');s.appendChild(b);}
  return s;
}
function render(list){
  const g=document.getElementById('plays');g.innerHTML='';
  if(!list.length){g.innerHTML='<p class="empty">No plays yet.</p>';return;}
  for(const p of list){
    const a=document.createElement('a');a.className='card';a.href=p.file;
    a.appendChild(thumb(p.thumb));
    const info=document.createElement('div');info.className='info';
    const n=document.createElement('p');n.className='name';n.textContent=p.title;
    const d=document.createElement('p');d.className='desc';d.textContent=p.description;
    const t=document.createElement('span');t.className='tag '+p.category;t.textContent=p.category;
    info.append(n,d,t);a.appendChild(info);
    if(p.id===last){const l=document.createElement('span');l.className='last';l.textContent='Last opened';a.appendChild(l);}
    g.appendChild(a);
  }
}
fetch('plays.json').then(r=>r.json()).then(render).catch(()=>{document.getElementById('plays').innerHTML='<p class="empty">Couldn’t load the play list.</p>';});

// ---------- offline status + updates ----------
const pill=document.getElementById('status'),upd=document.getElementById('update');
function status(text,kind){pill.textContent=text;pill.className='pill'+(kind?' '+kind:'');}
if(!('serviceWorker' in navigator)||!window.isSecureContext){
  status('Offline not available here','warn');
}else{
  let reloading=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!reloading){reloading=true;location.reload();}});
  const offerUpdate=w=>{status('Update ready','ok');upd.hidden=false;upd.onclick=()=>{upd.disabled=true;upd.textContent='Updating…';w.postMessage('skipWaiting');};};
  const track=w=>{
    if(!w) return;
    const onState=()=>{
      if(w.state==='installed'){ if(navigator.serviceWorker.controller) offerUpdate(w); }
      else if(w.state==='activated'){ status('Offline ready','ok'); }
      else if(w.state==='redundant'){ navigator.serviceWorker.controller?status('Offline ready','ok'):status('Offline setup failed. Reopen on Wi‑Fi','warn'); }
    };
    w.addEventListener('statechange',onState);onState();
  };
  navigator.serviceWorker.register('sw.js').then(reg=>{
    if(reg.waiting&&navigator.serviceWorker.controller) offerUpdate(reg.waiting);
    else if(reg.active) status('Offline ready','ok');
    else { status('Installing…'); track(reg.installing); }
    reg.addEventListener('updatefound',()=>{ if(reg.active) status('Downloading update…'); track(reg.installing); });
    if(navigator.onLine) reg.update().catch(()=>{});
  }).catch(()=>status('Offline setup failed. Reopen on Wi‑Fi','warn'));
  // ask the browser not to evict saved data (zone layouts) under storage pressure
  if(navigator.storage&&navigator.storage.persist) navigator.storage.persist().catch(()=>{});
}
})();
</script>
</body>
</html>
